# Builds Drag-Trainer.exe on GitHub's servers from the tagged source and publishes it
# as a release, with a SHA-256 checksum and a signed build-provenance attestation, so
# anyone can check the download came from this repo's code.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/Drag-Trainer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Drag-Trainer.exe" | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Drag-Trainer.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          release/Drag-Trainer.exe release/SHA256SUMS.txt
          --title "Drag Trainer ${{ github.ref_name }}"
          --notes-file .github/release-notes.md
